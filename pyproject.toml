[project]
name = "cifr"
version = "0.1.0"
description = "Enumerate and rank the TLS cipher suites exposed by a domain or IP address"
readme = "README.md"
authors = [
    { name = "Paul Stevens", email = "ps@theblackwall.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
cifr = "cifr:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
